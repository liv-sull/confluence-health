<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Confluence Content Health</title>
<style>
:root{
  --bg:#fcfcfb; --ink:#141413; --ink-2:#52514e; --ink-3:#8a8984; --rule:#e3e2de; --track:#efeee9;
  --a1:#86b6ef; --a2:#3f8fe4; --a3:#1f64b8; --a4:#0d3a73;
  --accent:#2a78d6; --current:#c9c7c0; --orange:#eb6834; --tip:#141413; --tip-ink:#fcfcfb;
  --pass:#0a7d0a; --fail:#c2410c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e87; --rule:#383835; --track:#2a2a28;
    --a1:#86b6ef; --a2:#5598e7; --a3:#2a78d6; --a4:#184f95;
    --accent:#3987e5; --current:#55544f; --orange:#d95926; --tip:#f0efec; --tip-ink:#1a1a19;
    --pass:#4cc44c; --fail:#f2884f;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e87; --rule:#383835; --track:#2a2a28;
  --a1:#86b6ef; --a2:#5598e7; --a3:#2a78d6; --a4:#184f95;
  --accent:#3987e5; --current:#55544f; --orange:#d95926; --tip:#f0efec; --tip-ink:#1a1a19;
  --pass:#4cc44c; --fail:#f2884f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1200px;margin:0 auto;padding:28px 28px 48px}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
a:hover{border-bottom-color:var(--accent)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
h1{font-size:clamp(28px,4.2vw,44px);line-height:1.08;letter-spacing:-.025em;margin:0 0 18px}
h2{font-size:22px;letter-spacing:-.015em;margin:0 0 10px;line-height:1.2}
h3{font-size:15px;margin:0 0 6px}
p{margin:0 0 12px}
.cap{font-size:13.5px;color:var(--ink-3);margin:0 0 14px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ink);margin:0 0 30px}
.tabs button{font:inherit;font-size:15px;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-3);padding:10px 16px 9px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[role=tabpanel][hidden]{display:none}

/* summary */
.lead{font-size:clamp(18px,2.2vw,22px);line-height:1.4;margin:0 0 28px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 0 40px}
.kpi{padding:18px 20px 20px 0}
.kpi+.kpi{padding-left:20px;border-left:1px solid var(--rule)}
.kpi .v{font-size:clamp(32px,4vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1}
.kpi .l{font-size:14px;color:var(--ink-2);margin-top:8px}
.block{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:26px 0;border-top:1px solid var(--rule)}
.block>h2{font-size:18px;margin:2px 0 0}
.big{font-size:clamp(18px,2vw,21px);line-height:1.4;font-weight:600;margin:0 0 16px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.strip div{border-top:3px solid var(--accent);padding-top:8px;font-size:14px;color:var(--ink-2)}
.strip b{display:block;color:var(--ink);font-size:15px}
.results{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px}
.results td{padding:9px 14px 9px 0;border-top:1px solid var(--rule);vertical-align:top}
.results td:first-child{white-space:nowrap;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.badge.fail{color:var(--fail)} .badge.pass{color:var(--pass)}
.why{margin:16px 0 0;padding:14px 16px;background:var(--track);border-radius:4px;font-size:15px}
.why b{color:var(--ink)}
.ask ul{margin:0;padding-left:20px}
.ask li{margin:0 0 8px}
.fine{font-size:13px;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:16px;margin-top:10px}

/* detail */
.sec{padding:30px 0;border-top:1px solid var(--rule)}
.sec:first-child{border-top:0;padding-top:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:44px}
figure{margin:0}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--ink-2);font-size:12px;font-family:inherit}
svg .val{fill:var(--ink);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12.5px;padding:0 12px 6px 0;border-bottom:1px solid var(--ink)}
td{padding:8px 12px 8px 0;border-bottom:1px solid var(--rule)}
th:last-child,td:last-child{padding-right:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.em td{font-weight:700}
tfoot td{border-bottom:0;padding-top:10px}
.tag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--rule)}
.tag.on{background:var(--a4)} .tag.mid{background:var(--a2)}
td.wm{color:var(--ink-2);font-size:13.5px}
.tw{overflow-x:auto}
table.sortable th[data-t]{cursor:pointer;user-select:none;white-space:nowrap}
table.sortable th[data-t]:hover,table.sortable th[data-t]:focus{color:var(--ink);outline:none}
table.sortable th[aria-sort=ascending]::after{content:" \2191"}
table.sortable th[aria-sort=descending]::after{content:" \2193"}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:14px;color:var(--ink-2);margin:6px 0 18px}
.ctrl input{accent-color:var(--accent);width:170px}
.ctrl b{color:var(--ink);font-variant-numeric:tabular-nums}
.effort{display:grid;grid-template-columns:230px 1fr;gap:10px 18px;align-items:center}
.effort .lab{font-size:14px}
.effort .lab small{display:block;color:var(--ink-3);font-size:12.5px}
.track{height:28px;position:relative}
.fill{height:100%;background:var(--accent);border-radius:0 3px 3px 0;min-width:3px}
.fill.hi{background:var(--a4)}
.track span{position:absolute;top:5px;font-size:13.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.terms{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.terms dt{font-weight:700;font-size:14px}
.terms dd{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.bar:hover,.bar:focus{opacity:.8;outline:none}
#tip{position:fixed;pointer-events:none;background:var(--tip);color:var(--tip-ink);font-size:12.5px;padding:6px 9px;border-radius:4px;opacity:0;transition:opacity .08s;z-index:5;white-space:nowrap}

/* data */
.tabsheet{width:100%;font-size:14px}
.tabsheet td:first-child{font-weight:600;white-space:nowrap}
.check td:first-child{font-weight:700;white-space:nowrap}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:0;padding:10px 16px;border-radius:4px;font-weight:600;font-size:14px}
.btn:hover{opacity:.9}

/* builder */
.builder{max-width:640px;margin:60px auto;padding:0 24px}
.builder h1{margin-bottom:12px}
.builder ol{padding-left:20px;color:var(--ink-2)}
.builder input[type=file]{margin:18px 0}
.builder label{display:block;font-size:13px;color:var(--ink-2);margin-top:6px}
.builder input[type=url]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink);margin:4px 0}
.builder textarea{width:100%;height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--track);color:var(--ink);border:1px solid var(--rule);padding:10px;border-radius:4px}
.builder button{font:inherit;background:var(--ink);color:var(--bg);border:0;padding:9px 16px;border-radius:4px;cursor:pointer;margin-top:10px}
.err{color:#d03b3b}

@media (max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){padding-left:0;border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--rule)}
  .block{grid-template-columns:1fr;gap:10px}
  .pair{grid-template-columns:1fr;gap:30px}
  .terms{grid-template-columns:1fr 1fr}
  .effort{grid-template-columns:1fr}
}
@media (max-width:560px){
  main{padding:20px 16px 40px}
  .strip{grid-template-columns:1fr 1fr}
  .terms{grid-template-columns:1fr}
  .results td:first-child{white-space:normal}
  td.wm,th.wm{display:none}
  .tabs button{padding:10px 10px 9px;font-size:14px}
}
</style>

</head>
<body>
<div id="app"></div>
<div id="tip" role="tooltip"></div>
<script>
(function(){
const app=document.getElementById('app'), tip=document.getElementById('tip');
const fmt=n=>Number(n).toLocaleString('en-AU');
const pct=n=>(n>=0.995&&n<1)?'99%+':Math.round(n*100)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function decode(h){
  let b=h.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4)b+='=';
  const bin=atob(b), bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function encode(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj)); let bin='';
  bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

/* hover layer */
document.addEventListener('pointermove',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){tip.style.opacity=0;return}
  tip.textContent=t.getAttribute('data-tip'); tip.style.opacity=1;
  const w=tip.offsetWidth; let x=e.clientX+14; if(x+w>innerWidth-8)x=e.clientX-w-14;
  tip.style.left=x+'px'; tip.style.top=(e.clientY+14)+'px';
});

/* ---------- charts (plain SVG) ---------- */
function columns(vals,labels,colors){
  const W=560,H=260,top=26,bot=28,left=4,gap=18;
  const max=Math.max(...vals), bw=(W-left-gap*(vals.length-1))/vals.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pages by time since last edit">`;
  s+=`<line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="var(--ink-3)"/>`;
  vals.forEach((v,i)=>{
    const h=(H-top-bot)*v/max, x=left+i*(bw+gap), y=H-bot-h;
    s+=`<path class="bar" tabindex="0" data-tip="${esc(labels[i])}: ${fmt(v)} pages" d="M${x},${H-bot} V${y+4} q0,-4 4,-4 H${x+bw-4} q4,0 4,4 V${H-bot} Z" fill="${colors[i]}"/>`;
    s+=`<text class="val" x="${x+bw/2}" y="${y-8}" text-anchor="middle">${fmt(v)}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return s+'</svg>';
}
function years(rows){
  const W=560,H=280,top=10,bot=30,left=44;
  const max=Math.max(...rows.map(r=>r[1]+r[2])), step=(W-left)/rows.length, bw=step*0.68;
  const nice=Math.ceil(max/5000)*5000;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pages by year created">`;
  for(let g=0;g<=nice;g+=5000){
    const y=H-bot-(H-top-bot)*g/nice;
    s+=`<line x1="${left}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--rule)"/>`;
    s+=`<text x="${left-8}" y="${y+4}" text-anchor="end">${g/1000}k</text>`;
  }
  rows.forEach((r,i)=>{
    const x=left+i*step+(step-bw)/2, hu=(H-top-bot)*r[2]/nice, hk=(H-top-bot)*r[1]/nice;
    const yb=H-bot;
    if(r[2]) s+=`<rect class="bar" tabindex="0" data-tip="${r[0]}: ${fmt(r[2])} pages, creator has left" x="${x}" y="${yb-hu}" width="${bw}" height="${hu}" fill="var(--orange)"/>`;
    if(r[1]) s+=`<rect class="bar" tabindex="0" data-tip="${r[0]}: ${fmt(r[1])} pages, creator named (likely owner)" x="${x}" y="${yb-hu-hk}" width="${bw}" height="${Math.max(hk-2,0)}" fill="var(--accent)" rx="2"/>`;
    if(i%2===0||i===rows.length-1) s+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle">${String(r[0]).slice(2)==='08'?r[0]:"'"+String(r[0]).slice(2)}</text>`;
  });
  return s+`<line x1="${left}" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="var(--ink-3)"/></svg>`;
}

function render(d){
  const date=new Date(d.d+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  const asAt=new Date(d.d+'T00:00:00');
  const yrsBack=n=>{const x=new Date(asAt); x.setFullYear(x.getFullYear()-n); return x.toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})};
  const k=d.k, a=d.a, w=d.w||[];
  const untouched=a[2]+a[3];
  const leftAll=d.y.reduce((t,x)=>t+x[2],0);
  const top=w.reduce((t,x)=>t+x[2],0);
  const R=Object.fromEntries(d.r.map(r=>[r[0],r]));
  const noSpace=R['Fix: pages missing a space']?R['Fix: pages missing a space'][2]:0;
  const MPP=2, HPW=30, WPY=44;
  const hrs=pages=>pages*MPP/60;
  const yearsFor=pages=>hrs(pages)/(HPW*WPY);
  const weeksFor=pages=>Math.round(hrs(pages)/HPW);
  const spLink=(name,key)=>key&&d.b?`<a href="${esc(d.b)}/wiki/spaces/${encodeURIComponent(key)}" target="_blank" rel="noopener">${esc(name)}</a>`:esc(name);
  const ago=y=>y==null?'':y<0.1?'This month':y<1?(Math.round(y*12)===1?'1 month ago':Math.round(y*12)+' months ago'):y.toFixed(1)+' years ago';
  const batches=[1,2,3,4].map(b=>{const s=w.filter(x=>x[4]===b);return {b,n:s.length,u:s.reduce((t,x)=>t+x[2],0)}});
  const badge=ok=>ok?'<span class="badge pass">&#10003; Worked</span>':'<span class="badge fail">&#10007; Failed</span>';
  const tests=[
    ['Count every page in the wiki',false,`Each search stops at 150 pages. It couldn't list spaces or give totals.`,`Listing every page would take ${fmt(Math.ceil(k[0]/150))} searches before any page is checked.`],
    ['Find who owns a page',false,'Named the wrong person as owner of a Network Architecture page.','Its owner names can’t be relied on.'],
    ['Find every page edited in one month',false,'In SysOps Documentation it found 5 pages. The export shows 26.','21 pages were missed, with no warning.'],
    ['Compare page owner with page creator',true,'Matched on all 35 Network Architecture pages it found.','The export’s creator is a fair stand-in for the owner.']];
  const order=['Archive candidate','Archive (agreed)','Delete candidate','Merge candidate','Owner clean-up','Investigate (flagged)','Review','Keep','Keep (agreed)','Fix: pages missing a space'];
  const what={'Archive candidate':'Nobody has edited any page in the space for 2+ years.','Archive (agreed)':'Already agreed in the manual review.','Delete candidate':'Test spaces, copies, or spaces with no pages.','Merge candidate':'Five pages or fewer, quiet for a year. Could fold into a related space.','Owner clean-up':'Big and still in use, but at least 75% of pages are 2+ years old.','Investigate (flagged)':'Flagged in the manual review for a closer look.','Review':'Half or more of the pages are 2+ years old.','Keep':'Mostly current.','Keep (agreed)':'Agreed to keep in the manual review.','Fix: pages missing a space':'Pages the export couldn’t match to a space.'};
  const strong=['Archive candidate','Archive (agreed)','Delete candidate','Merge candidate'];
  const rows=order.filter(n=>R[n]).map(n=>R[n]);
  const tot=rows.reduce((t,r)=>[t[0]+r[1],t[1]+r[2]],[0,0]);
  const gone=d.y.filter(r=>+r[0]<2018).reduce((t,r)=>[t[0]+r[1],t[1]+r[2]],[0,0]);
  const goneShare=gone[1]/(gone[0]+gone[1]);
  const whyBox=`<p class="why"><b>These limits come from how Rovo works.</b> It's built to find a handful of relevant pages to answer a question. Counting and checking every page in the wiki is a different job, and it wasn't designed for it. The results say nothing about the quality of what teams have put into Confluence.</p>`;

  app.innerHTML=`<main>
  <p class="eyebrow">Vocus Confluence · data as at ${date}</p>
  <h1>Confluence clean-up: why we need to work in batches</h1>
  <div class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-sum" aria-controls="p-sum" aria-selected="true">Summary</button>
    <button role="tab" id="t-det" aria-controls="p-det" aria-selected="false" tabindex="-1">Detail</button>
    <button role="tab" id="t-dat" aria-controls="p-dat" aria-selected="false" tabindex="-1">Data</button>
  </div>

  <section role="tabpanel" id="p-sum" aria-labelledby="t-sum">
    <p class="lead">Confluence is the Vocus wiki, where teams keep their processes and guides. Most of it hasn't been updated in years, and checking every page at once is too big a job.</p>
    <div class="kpis">
      <div class="kpi"><div class="v">${fmt(k[0])}</div><div class="l">pages in the wiki</div></div>
      <div class="kpi"><div class="v">${Math.round(untouched/k[0]*100)}%</div><div class="l">not edited in 2+ years</div></div>
      <div class="kpi"><div class="v">${pct(leftAll/k[0])}</div><div class="l">written by people who have left Vocus</div></div>
      <div class="kpi"><div class="v">${yearsFor(k[0]).toFixed(1)} yrs</div><div class="l">for one person to check every page</div></div>
    </div>

    ${w.length?`<div class="block">
      <h2>The plan</h2>
      <div>
        <p class="big">Start with the 20 spaces that hold ${Math.round(top/untouched*100)}% of the out-of-date pages. Work through them in four batches of five.</p>
        <div class="strip">${batches.map(x=>`<div><b>Batch ${x.b}</b>${fmt(x.u)} out-of-date pages · about ${weeksFor(x.u)} weeks</div>`).join('')}</div>
      </div>
    </div>`:''}

    <div class="block">
      <h2>Why AI can't do it for us</h2>
      <div>
        <p>We tested Rovo, the AI built into Confluence, on ${date}.</p>
        <table class="results"><tbody>${tests.map(t=>`<tr><td>${t[0]}</td><td>${badge(t[1])}</td><td>${t[2]}</td></tr>`).join('')}</tbody></table>
        ${whyBox}
      </div>
    </div>

    <div class="block ask">
      <h2>What we need</h2>
      <ul>
        <li>Agreement to start with these 20 spaces, one batch at a time.</li>
        <li>A named owner for each space, who decides what stays.</li>
        <li>Approval to archive pages untouched for 5+ years unless the owner wants them kept. Archived pages can be restored.</li>
        <li>A check-in after the first batch.</li>
      </ul>
    </div>
    <p class="fine">"Not edited" doesn't mean unused. Some old pages are still read. Time estimates assume ${MPP} minutes a page, ${HPW} productive hours a week and ${WPY} working weeks a year. Charts are in Detail. The raw data is in Data.</p>
  </section>

  <section role="tabpanel" id="p-det" aria-labelledby="t-det" hidden>
    <div class="sec">
      <h2>How old the content is</h2>
      <div class="pair">
        <figure>
          <h3>Time since each page was last edited</h3>
          <p class="cap">${fmt(a[3])} pages haven't been touched in five years or more.</p>
          ${columns(a,['Under 1 year','1–2 years','2–5 years','5+ years'],['var(--a1)','var(--a2)','var(--a3)','var(--a4)'])}
        </figure>
        <figure>
          <h3>Pages written each year</h3>
          <div class="legend"><span><i style="background:var(--accent)"></i>Author still named</span><span><i style="background:var(--orange)"></i>Author has left Vocus</span></div>
          <p class="cap">${goneShare>0.98?'Almost every page':Math.round(goneShare*100)+'% of pages'} written before 2018 ${goneShare>0.98?'belongs':'belong'} to someone who has since left.</p>
          ${years(d.y)}
        </figure>
      </div>
    </div>

    ${w.length?`<div class="sec">
      <h2>The 20 spaces to start with</h2>
      <p class="cap">They hold ${fmt(top)} of the ${fmt(untouched)} out-of-date pages. Click a heading to sort. Space names open the space in Confluence.</p>
      <div class="tw"><table class="sortable">
        <thead><tr><th class="num" data-t="n">Batch</th><th data-t="s">Space</th><th class="num" data-t="n">Pages</th><th class="num" data-t="n">Not edited 2+ yrs</th><th class="num" data-t="n">%</th><th class="num" data-t="n">Last edited</th><th data-t="s">Suggestion</th></tr></thead>
        <tbody>${w.map(x=>`<tr><td class="num" data-v="${x[4]}">${x[4]}</td><td data-v="${esc(x[0])}">${spLink(x[0],x[5])}</td><td class="num" data-v="${x[1]}">${fmt(x[1])}</td><td class="num" data-v="${x[2]}">${fmt(x[2])}</td><td class="num" data-v="${x[2]/x[1]}">${pct(x[2]/x[1])}</td><td class="num" data-v="${x[6]??''}">${ago(x[6])}</td><td data-v="${esc(x[3])}">${esc(x[3])}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>

    <div class="sec">
      <h2>How long a full review would take</h2>
      <p class="cap">Move the slider to test a different pace.</p>
      <div class="ctrl"><label for="mpp">Minutes per page</label><input id="mpp" type="range" min="0.5" max="5" step="0.5" value="${MPP}"><b id="mppv">${MPP}</b></div>
      <div class="effort" id="effort"></div>
    </div>`:''}

    <div class="sec">
      <h2>Suggested action for every space</h2>
      <p class="cap">Simple rules based on age and size, applied to all ${fmt(k[1])} spaces. Each one starts a conversation with the space owner. Nothing changes without them.</p>
      <div class="tw"><table class="sortable acts">
        <thead><tr><th data-t="s">Suggestion</th><th class="wm">What it means</th><th class="num" data-t="n">Spaces</th><th class="num" data-t="n">Pages</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td data-v="${esc(r[0])}" style="white-space:nowrap"><span class="tag ${strong.includes(r[0])?'on':r[0]==='Owner clean-up'?'mid':''}"></span>${esc(r[0])}</td><td class="wm">${what[r[0]]||''}</td><td class="num" data-v="${r[1]}">${fmt(r[1])}</td><td class="num" data-v="${r[2]}">${fmt(r[2])}</td></tr>`).join('')}</tbody>
        <tfoot><tr class="em"><td>Total</td><td class="wm"></td><td class="num">${fmt(tot[0])}</td><td class="num">${fmt(tot[1])}</td></tr></tfoot>
      </table></div>
    </div>

    <div class="sec">
      <h2>The Rovo tests in full</h2>
      <p class="cap">Run on ${date} with a Rovo agent built in Rovo Studio.</p>
      <div class="tw"><table>
        <thead><tr><th>What we asked</th><th>Result</th><th>What happened</th><th>What it means</th></tr></thead>
        <tbody>${tests.map(t=>`<tr><td style="font-weight:600">${t[0]}</td><td>${badge(t[1])}</td><td>${t[2]}</td><td>${t[3]}</td></tr>`).join('')}</tbody>
      </table></div>
      ${whyBox}
    </div>

    <div class="sec">
      <h2>Terms used</h2>
      <dl class="terms">
        <div><dt>Page</dt><dd>One document in the wiki.</dd></div>
        <div><dt>Space</dt><dd>A team or project's area of the wiki, like a shared folder.</dd></div>
        <div><dt>Not edited</dt><dd>Nobody has changed it. It may still be read.</dd></div>
        <div><dt>Archive</dt><dd>Hidden from search and menus. Can be restored at any time.</dd></div>
      </dl>
    </div>
  </section>

  <section role="tabpanel" id="p-dat" aria-labelledby="t-dat" hidden>
    <div class="sec">
      <h2>Check the numbers yourself</h2>
      <p>Every figure here comes from two spreadsheets: the full Confluence export and the manual space review. Both are in the workbook unchanged, so you can sort and filter the raw data and compare it with what this page says.</p>
      <p>${d.x?`<a class="btn" href="${esc(d.x)}" target="_blank" rel="noopener">Open the workbook</a>`:'The workbook, <b>Confluence_Content_Health_Dashboard.xlsx</b>, is attached to this Confluence page.'}</p>
    </div>
    <div class="sec">
      <h3>Where each headline number comes from</h3>
      <div class="tw"><table class="check">
        <thead><tr><th>Number</th><th>How to check it in the workbook</th></tr></thead>
        <tbody>
          <tr><td>${fmt(k[0])} pages</td><td>Count the rows in <b>Raw - All Pages</b>.</td></tr>
          <tr><td>${fmt(untouched)} not edited in 2+ years</td><td>In <b>Raw - All Pages</b>, filter Last updated date to before ${yrsBack(2)}.</td></tr>
          <tr><td>${fmt(a[3])} not edited in 5+ years</td><td>Same tab, filter Last updated date to before ${yrsBack(5)}.</td></tr>
          <tr><td>${fmt(leftAll)} written by people who have left</td><td>Same tab, filter Created by to "Unknown/ Former User Deleted".</td></tr>
          <tr><td>${fmt(k[1])} spaces</td><td><b>Space Summary</b>, every row except "Not found". Includes spaces with no pages.</td></tr>
          <tr><td>${fmt(k[4])} dormant spaces</td><td><b>Space Summary</b>, filter Years since last edit to 2 or more.</td></tr>
          ${w.length?`<tr><td>${fmt(top)} pages in the top 20</td><td><b>Top 20 batch plan</b>, total of the Untouched 2+ yrs column.</td></tr>`:''}
        </tbody>
      </table></div>
    </div>
    <div class="sec">
      <h3>What's in the workbook</h3>
      <div class="tw"><table class="tabsheet">
        <thead><tr><th>Tab</th><th>What it holds</th></tr></thead>
        <tbody>
          <tr><td>Raw - All Pages</td><td>The original export. Every page with its title, link, status, created date, creator, last updated date and space.</td></tr>
          <tr><td>Raw - Space Details</td><td>The original export. Every space with who created it and when it was last updated.</td></tr>
          <tr><td>Raw - Manual review</td><td>The original space review, with its Y / N / Needs Investigation decisions and notes.</td></tr>
          <tr><td>Raw - Wiki Spaces Sheet2</td><td>The second tab of the space review file, unchanged.</td></tr>
          <tr><td>Space Summary</td><td>One row per space: page counts by age, likely owner and suggested action.</td></tr>
          <tr><td>Top 20 batch plan</td><td>The 20 spaces in their batches, with columns to record the space owner and progress.</td></tr>
          <tr><td>Top 20 pages</td><td>Every page in the 20 spaces, ready to hand to each space owner.</td></tr>
          <tr><td>Notes</td><td>The rules behind each suggestion. Change the yellow cells and everything recalculates.</td></tr>
        </tbody>
      </table></div>
      <p class="fine">The export lists who created each page, not who owns it. Our Rovo test showed creator and owner matched, so creator is used as the likely owner.${noSpace?` ${fmt(noSpace)} pages were exported without a space and are shown as "Not found".`:''}</p>
    </div>
  </section>
  </main>`;

  /* tabs */
  const tabs=[...document.querySelectorAll('[role=tab]')];
  const show=id=>{tabs.forEach(t=>{const on=t.id===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on});
    try{sessionStorage.setItem('cch-tab',id)}catch(_){} };
  tabs.forEach((t,i)=>{t.addEventListener('click',()=>show(t.id));
    t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];show(n.id);n.focus()}})});
  try{const s=sessionStorage.getItem('cch-tab'); if(s&&document.getElementById(s))show(s)}catch(_){}

  /* sortable tables */
  document.querySelectorAll('table.sortable').forEach(t=>{
    t.querySelectorAll('th[data-t]').forEach(th=>{
      const idx=[...th.parentNode.children].indexOf(th);
      th.tabIndex=0; th.setAttribute('role','button');
      const go=()=>{
        const asc=th.getAttribute('aria-sort')!=='ascending';
        t.querySelectorAll('th').forEach(x=>x.removeAttribute('aria-sort'));
        th.setAttribute('aria-sort',asc?'ascending':'descending');
        const tb=t.tBodies[0], rs=[...tb.rows], num=th.dataset.t==='n';
        rs.sort((p,q)=>{let x=p.cells[idx].dataset.v, y=q.cells[idx].dataset.v;
          if(num){x=x===''?Infinity:+x; y=y===''?Infinity:+y; return asc?x-y:y-x}
          return asc?x.localeCompare(y):y.localeCompare(x)});
        rs.forEach(r=>tb.appendChild(r));
      };
      th.addEventListener('click',go); th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
    });
  });

  /* effort slider */
  if(w.length){
    const scopes=[['Every page in the wiki',k[0],fmt(k[0])+' pages'],['Only pages not edited in 2+ years',untouched,fmt(untouched)+' pages'],
      ['The top 20 spaces',top,fmt(top)+' out-of-date pages'],['One batch of five spaces',top/4,'about '+fmt(Math.round(top/4))+' out-of-date pages']];
    const el=document.getElementById('effort'), sl=document.getElementById('mpp');
    const lab=h=>{const py=h/(HPW*WPY), wk=h/HPW; return py>=1?py.toFixed(1)+' years':Math.round(wk)+' weeks'};
    const draw=()=>{const m=+sl.value; document.getElementById('mppv').textContent=m;
      const max=k[0]*m/60;
      el.innerHTML=scopes.map((sc,i)=>{const h=sc[1]*m/60, wd=Math.max(h/max*100,0.6), inside=wd>58;
        return `<div class="lab">${sc[0]}<small>${sc[2]}</small></div><div class="track"><div class="fill ${i<2?'hi':''}" style="width:${wd}%" data-tip="${fmt(Math.round(h))} hours"></div><span style="${inside?'left:10px;color:#fff':'left:calc('+wd+'% + 10px)'}">${fmt(Math.round(h))} hrs · ${lab(h)} for one person</span></div>`}).join('');
    };
    sl.addEventListener('input',draw); draw();
  }
}

/* ---------- builder: no data in the link ---------- */
function builder(msg){
  app.innerHTML=`<div class="builder">
    <p class="eyebrow">Dashboard link builder</p>
    <h1>Load the workbook to make a link</h1>
    <ol>
      <li>Choose your updated <b>Confluence_Content_Health_Dashboard.xlsx</b>. It's read in your browser only and isn't uploaded anywhere.</li>
      <li>If the spreadsheet is attached to your Confluence page, paste its link first so the dashboard can point to it.</li>
      <li>Copy the link it gives you.</li>
      <li>Paste it into the iframe macro on your Confluence page.</li>
    </ol>
    ${msg?`<p class="err">${esc(msg)}</p>`:''}
    <label for="xl">Optional: link to the spreadsheet attached on your Confluence page</label>
    <input type="url" id="xl" placeholder="https://…">
    <input type="file" id="f" accept=".xlsx">
    <div id="out"></div>
  </div>`;
  document.getElementById('f').addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file)return;
    try{
      await loadXLSX();
      const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
      const cd=wb.Sheets['Chart Data'], db=wb.Sheets['Dashboard'], nt=wb.Sheets['Notes'];
      if(!cd||!db) throw new Error('Couldn’t find the Dashboard and Chart Data tabs. Use the dashboard workbook, not the raw export.');
      const v=(ws,a)=>ws[a]?ws[a].v:null;
      const asAt=v(nt,'C4'); const dt=asAt instanceof Date?asAt:new Date();
      const d={d:dt.toISOString().slice(0,10),
        k:['B6','F6','J6','N6','R6','V6'].map(a=>v(db,a)),
        a:[4,5,6,7].map(r=>v(cd,'B'+r)),
        r:[...Array(10)].map((_,i)=>[v(cd,'D'+(4+i)),v(cd,'E'+(4+i)),v(cd,'F'+(4+i)),v(cd,'G'+(4+i))]).filter(r=>r[0]),
        w:[...Array(20)].map((_,i)=>[v(cd,'Q'+(4+i)),v(cd,'R'+(4+i)),v(cd,'S'+(4+i)),v(cd,'T'+(4+i)),v(cd,'U'+(4+i)),v(cd,'V'+(4+i)),v(cd,'W'+(4+i))]).filter(r=>r[0]),
        y:[...Array(30)].map((_,i)=>[v(cd,'M'+(4+i)),v(cd,'N'+(4+i)),v(cd,'O'+(4+i))]).filter(r=>r[0]&&/^\d{4}$/.test(String(r[0])))};
      if(d.k.some(x=>x==null)) throw new Error('Some totals are blank. Open the workbook in Excel, save it, then try again.');
      d.k[2]=Math.round(d.k[2]*1000)/1000; d.k[3]=Math.round(d.k[3]*1000)/1000;
      const ss=wb.Sheets['Space Summary']; try{ d.b=new URL(v(ss,'B2')).origin }catch(_){}
      const x=document.getElementById('xl').value.trim(); if(x) d.x=x;
      const url=location.href.split('#')[0]+'#'+encode(d);
      document.getElementById('out').innerHTML=`<textarea readonly>${esc(url)}</textarea><button id="cp">Copy link</button> <a href="${esc(url)}" target="_blank" rel="noopener">Preview</a>`;
      document.getElementById('cp').onclick=()=>navigator.clipboard.writeText(url);
    }catch(err){builder(err.message)}
  });
}
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('Couldn’t load the spreadsheet reader.'));document.head.appendChild(s);});
}

const h=location.hash.slice(1);
if(h){ try{ render(decode(h)); }catch(e){ builder('That link looks incomplete. Make a fresh one below.'); } }
else builder();
addEventListener('hashchange',()=>location.reload());
})();
</script>
